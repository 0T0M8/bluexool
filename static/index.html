<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BlueXool Students</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- Toast Container -->
<div id="toast-container"></div>

<div class="container">
  <h1>🌊 Step to Excellence Student Database</h1>

  <section class="card">
    <h2>Add / Update Student</h2>
    <form id="studentForm">
      <input type="hidden" id="id" />

      <div class="form-grid">
        <input type="text" id="name" placeholder="Student Name" required />
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <input type="date" id="date_of_birth" required />
        <select id="status" required>
          <option value="">Select Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <input type="text" id="guardian_name" placeholder="Guardian Name" required />
        <input type="text" id="contact1" placeholder="Primary Contact" required />

        <input type="text" id="contact2" placeholder="Secondary Contact (optional)" />
      </div>

      <div class="actions">
        <button type="submit">Save Student</button>
        <button type="button" class="secondary" onclick="resetForm()">Clear</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Students</h2>

    <!-- Search / Filter -->
    <input
      type="text"
      id="search"
      placeholder="Search by Name, ID, or Status..."
      style="margin-bottom: 10px; padding: 8px; width: 100%; border-radius: 6px; border: none;"
    />

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Gender</th>
            <th>DOB</th>
            <th>Status</th>
            <th>Guardian</th>
            <th>Contact 1</th>
            <th>Contact 2</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="students"></tbody>
      </table>
    </div>
  </section>
</div>

<!-- Student Modal -->
<div id="studentModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Student Details</h2>
    <div id="studentDetails"></div>
    <div class="modal-actions">
      <button id="editStudentBtn">Edit</button>
      <button id="deleteStudentBtn" class="danger">Delete</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
