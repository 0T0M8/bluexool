<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BlueXool Students</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- =================== LOGIN SCREEN =================== -->
<div id="loginScreen" class="screen">
  <h1>Login</h1>
  <form id="loginForm">
    <input id="loginUsername" placeholder="Username" required />
    <input id="loginPassword" type="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <button onclick="showRegisterScreen()">Register</button></p>
</div>

<!-- =================== REGISTER SCREEN =================== -->
<div id="registerScreen" class="screen" style="display:none;">
  <h1>Register</h1>
  <form id="registerForm">
    <input id="regUsername" placeholder="Username" required />
    <input id="regPassword" type="password" placeholder="Password" required />
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <button onclick="showLoginScreen()">Login</button></p>
</div>

<!-- =================== APP SCREEN =================== -->
<div id="appScreen" class="screen" style="display:none;">
  <h1>🌊 Step to Excellence Student Database</h1>
  <button id="logoutBtn">Logout</button>

  <!-- Student Form -->
  <section class="card">
    <h2>Add / Update Student</h2>
    <form id="studentForm">
      <input type="hidden" id="id" />
      <div class="form-grid">
        <input type="text" id="name" placeholder="Student Name" required />
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="date_of_birth" required />
        <select id="status" required>
          <option value="">Select Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
        <input type="text" id="guardian_name" placeholder="Guardian Name" required />
        <input type="text" id="contact1" placeholder="Primary Contact" required />
        <input type="text" id="contact2" placeholder="Secondary Contact (optional)" />
      </div>
      <div class="actions">
        <button type="submit">Save Student</button>
        <button type="button" class="secondary" onclick="resetForm()">Clear</button>
      </div>
    </form>
  </section>

  <!-- Students Table -->
  <section class="card">
    <h2>Students</h2>
    <input
      type="text"
      id="search"
      placeholder="Search by Name, ID, or Status..."
      style="margin-bottom:10px; padding:8px; width:100%; border-radius:6px; border:none;"
    />
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Gender</th><th>DOB</th>
            <th>Status</th><th>Guardian</th><th>Contact 1</th><th>Contact 2</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="students"></tbody>
      </table>
    </div>
  </section>
</div>

<!-- Student Modal -->
<div id="studentModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Student Details</h2>
    <div id="studentDetails"></div>
    <div class="modal-actions">
      <button id="editStudentBtn">Edit</button>
      <button id="deleteStudentBtn" class="danger">Delete</button>
    </div>
  </div>
</div>

<script>
/* =================== TOAST UTILITY =================== */
function showToast(message, type='info'){
  const container=document.getElementById('toast-container');
  const toast=document.createElement('div');
  toast.className=`toast ${type}`;
  toast.textContent=message;
  container.appendChild(toast);
  setTimeout(()=>toast.remove(),3500);
}

/* =================== SCREEN SWITCH =================== */
function showLoginScreen(){ document.getElementById('loginScreen').style.display='block'; document.getElementById('registerScreen').style.display='none'; document.getElementById('appScreen').style.display='none'; }
function showRegisterScreen(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('registerScreen').style.display='block'; document.getElementById('appScreen').style.display='none'; }
function showAppScreen(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('registerScreen').style.display='none'; document.getElementById('appScreen').style.display='block'; }

/* =================== LOGIN =================== */
const loginForm=document.getElementById('loginForm');
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const username=document.getElementById('loginUsername').value;
  const password=document.getElementById('loginPassword').value;

  try{
    const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    if(!res.ok) throw new Error('Invalid credentials');
    await res.json();
    showToast('Login successful','success');
    showAppScreen();
    loadStudents();
  }catch(err){ showToast(err.message,'error'); }
});

/* =================== REGISTER =================== */
const registerForm=document.getElementById('registerForm');
registerForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const username=document.getElementById('regUsername').value;
  const password=document.getElementById('regPassword').value;

  try{
    const res=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Registration failed');
    showToast('Registration successful','success');
    showLoginScreen();
  }catch(err){ showToast(err.message,'error'); }
});

/* =================== LOGOUT =================== */
const logoutBtn=document.getElementById('logoutBtn');
logoutBtn.addEventListener('click',async ()=>{
  try{
    await fetch('/logout',{method:'POST'});
    showToast('Logged out','info');
    showLoginScreen();
  }catch(err){ showToast('Logout failed','error'); }
});

/* =================== STUDENT FUNCTIONS =================== */
const form=document.getElementById('studentForm');
const tableBody=document.getElementById('students');
const searchInput=document.getElementById('search');
const modal=document.getElementById('studentModal');
const modalBody=document.getElementById('studentDetails');
const modalClose=modal.querySelector('.close');

function resetForm(){ form.reset(); document.getElementById('id').value=''; }

async function loadStudents(){
  try{
    const res=await fetch('/students');
    if(!res.ok) throw new Error('Failed to fetch students');
    const students=await res.json();
    tableBody.innerHTML='';
    students.forEach(s=>{
      const row=document.createElement('tr');
      row.innerHTML=`<td>${s.id}</td><td>${s.name}</td><td>${s.gender}</td><td>${s.date_of_birth}</td><td><span class="status-pill ${s.status==="Active"?"status-active":"status-inactive"}">${s.status}</span></td><td>${s.guardian_name}</td><td>${s.contact1}</td><td>${s.contact2}</td><td>▶</td>`;
      row.addEventListener('click',()=>showStudentModal(s));
      tableBody.appendChild(row);
    });
    filterStudents();
  }catch(err){ showToast(err.message,'error'); }
}

/* MODAL FUNCTIONS */
function showStudentModal(student){
  modalBody.innerHTML=`<p><strong>ID:</strong>${student.id}</p><p><strong>Name:</strong>${student.name}</p><p><strong>Gender:</strong>${student.gender}</p><p><strong>Date of Birth:</strong>${student.date_of_birth}</p><p><strong>Status:</strong>${student.status}</p><p><strong>Guardian:</strong>${student.guardian_name}</p><p><strong>Contact 1:</strong>${student.contact1}</p><p><strong>Contact 2:</strong>${student.contact2}</p>`;
  modal.style.display='block';
  document.getElementById('editStudentBtn').onclick=()=>{ editStudent(student); modal.style.display='none'; };
  document.getElementById('deleteStudentBtn').onclick=async()=>{ if(!confirm(`Delete ${student.name}?`)) return; await deleteStudent(student.id); modal.style.display='none'; loadStudents(); };
}
modalClose.onclick=()=>modal.style.display='none';
window.onclick=e=>{ if(e.target==modal) modal.style.display='none'; };

function editStudent(student){
  document.getElementById('id').value=student.id;
  document.getElementById('name').value=student.name;
  document.getElementById('gender').value=student.gender;
  document.getElementById('date_of_birth').value=student.date_of_birth;
  document.getElementById('status').value=student.status;
  document.getElementById('guardian_name').value=student.guardian_name;
  document.getElementById('contact1').value=student.contact1;
  document.getElementById('contact2').value=student.contact2;
  showToast('Editing student ID '+student.id,'info');
}

/* ADD / UPDATE STUDENT */
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=document.getElementById('id').value;
  const data={
    name: document.getElementById('name').value,
    gender: document.getElementById('gender').value,
    date_of_birth: document.getElementById('date_of_birth').value,
    status: document.getElementById('status').value,
    guardian_name: document.getElementById('guardian_name').value,
    contact1: document.getElementById('contact1').value,
    contact2: document.getElementById('contact2').value
  };
  if(id) data.id=parseInt(id);
  try{
    const res=await fetch('/students',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const result=await res.json();
    if(result.error) throw new Error(result.error);
    showToast(id?'Student updated!':'Student added!','success');
    resetForm(); loadStudents();
  }catch(err){ showToast(err.message,'error'); }
});

/* DELETE STUDENT */
async function deleteStudent(id){
  try{
    const res=await fetch(`/students?id=${id}`,{method:'DELETE'});
    const result=await res.json();
    if(result.error) throw new Error(result.error);
    showToast('Student deleted!','success');
    loadStudents();
  }catch(err){ showToast(err.message,'error'); }
}

/* SEARCH / FILTER */
function filterStudents(){
  const filter=searchInput.value.toLowerCase();
  tableBody.querySelectorAll('tr').forEach(row=>{
    const cells=row.querySelectorAll('td');
    const match=Array.from(cells).some(td=>td.textContent.toLowerCase().includes(filter));
    row.style.display=match?'':'none';
  });
}
searchInput.addEventListener('input',filterStudents);
</script>
</body>
</html>
