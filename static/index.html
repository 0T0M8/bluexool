<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BlueXool Students</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- Toast Container -->
<div id="toast-container"></div>

<div class="container">
  <h1>🌊 BlueXool Student Manager</h1>

  <section class="card">
    <h2>Add / Update Student</h2>

    <form id="studentForm">
      <input type="hidden" id="id" />

      <input type="text" id="name" placeholder="Name" required />
      <input type="text" id="gender" placeholder="Gender (M/F)" required />
      <input type="date" id="date_of_birth" placeholder="Date of Birth" required />
      <input type="text" id="status" placeholder="Status" required />
      <input type="text" id="guardian_name" placeholder="Guardian Name" required />
      <input type="text" id="contact1" placeholder="Contact 1" required />
      <input type="text" id="contact2" placeholder="Contact 2" />

      <div class="actions">
        <button type="submit">Save Student</button>
        <button type="button" class="secondary" onclick="resetForm()">Clear</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Students</h2>

    <!-- Search / Filter -->
    <input
      type="text"
      id="search"
      placeholder="Search by Name, ID, or Status..."
      style="margin-bottom: 10px; padding: 8px; width: 100%; border-radius: 6px; border: none;"
    />

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Gender</th>
          <th>DOB</th>
          <th>Status</th>
          <th>Guardian</th>
          <th>Contact 1</th>
          <th>Contact 2</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="students"></tbody>
    </table>
  </section>
</div>

<script src="/static/app.js"></script>
</body>
</html>
